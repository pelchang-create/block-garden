html,body{width:100%;height:100%;overflow:hidden;background:#10152a radial-gradient(ellipse 120% 100% at 50% 0%,#22305a 0%,#141A2E 55%,#10152a 100%) fixed;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.layer{position:absolute;inset:0}

.btn:active{transform:translateY(1px) scale(.985)}
.pri{background:linear-gradient(180deg,#FFD166,#FFB86B);color:#141A2E;box-shadow:0 6px 24px rgba(255,184,107,.35)}

.muted{color:rgba(244,241,234,.6)}.small{font-size:13px}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#141A2E;flex:none}

.pc{display:grid;gap:2px}
.modal{position:absolute;inset:0;background:rgba(10,14,30,.62);display:flex;align-items:center;justify-content:center;z-index:20}

.tabs{display:flex;gap:10px;margin:14px 0}
.tab{min-height:50px;padding:0 20px;border-radius:14px;display:flex;align-items:center;cursor:pointer;background:rgba(244,241,234,.06);border:1px solid rgba(244,241,234,.14);font-weight:700}
.tab.on{background:rgba(255,209,102,.18);border-color:#FFD166;color:#FFD166}

.li .sc{margin-left:auto;font-weight:800;font-size:19px}

.hb{width:auto;min-width:60px;height:60px;min-height:60px;padding:0 16px;font-size:18px}
.tbtn{position:absolute;border-radius:18px;background:rgba(244,241,234,.09);border:1px solid rgba(244,241,234,.22);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#F4F1EA;touch-action:none;cursor:pointer;flex-direction:column;line-height:1.05}
.tbtn small{font-size:13px;font-weight:600;opacity:.7}

.big{font-size:56px;font-weight:900;line-height:1.1}

.stat{display:flex;justify-content:space-between;font-size:18px;padding:5px 0}

.modal.g{top:236px;background:rgba(10,14,30,.5)}

.modal.wide .dlg{min-width:600px}.modal .row .btn{white-space:nowrap}
.svta{display:block;width:640px;height:260px;border-radius:14px;border:2px solid rgba(255,209,102,.5);background:#141A2E;color:#F4F1EA;font:13px/1.4 ui-monospace,Menlo,monospace;padding:12px;-webkit-user-select:text;user-select:text;touch-action:pan-y;resize:none;outline:none}

/* ---------- storage ---------- */
const SKEY='fangkuai-huayuan-v1';
function loadDB(){try{const d=JSON.parse(localStorage.getItem(SKEY));if(d&&Array.isArray(d.players)&&Array.isArray(d.records))return d}catch(e){}return{players:[],cur:null,records:[],sound:false,mode:'classic'}}
const DEFAULT_NAME='本机玩家';
/* 打开就能玩：没有玩家时自动建一个「本机玩家」；已有存档照常读取 */
function ensurePlayer(){let ch=false;if(!DB.players.length){DB.players.push({id:'p'+Date.now().toString(36)+Math.floor(Math.random()*1e4),name:DEFAULT_NAME,color:AVC[0],created:Date.now()});ch=true}
 if(!DB.cur||!DB.players.some(p=>p.id===DB.cur)){DB.cur=DB.players[0].id;ch=true}return ch}
let DB=loadDB();
function saveDB(){try{if(DB.records.length>800)DB.records=DB.records.slice(-800);localStorage.setItem(SKEY,JSON.stringify(DB))}catch(e){}}
if(ensurePlayer())saveDB();
const player=id=>DB.players.find(p=>p.id===id);
const curPlayer=()=>player(DB.cur);
function better(a,b,mode){if(!b)return true;if(mode==='guardian'){if(a.levels!==b.levels)return a.levels>b.levels;return a.score>b.score}return a.score>b.score}
function bestOf(pid,mode){let b=null;for(const r of DB.records)if(r.pid===pid&&r.mode===mode&&better(r,b,mode))b=r;return b}
function ranking(mode){const out=[];for(const p of DB.players){const b=bestOf(p.id,mode);if(b)out.push({p,r:b})}out.sort((x,y)=>better(x.r,y.r,mode)?-1:1);return out}
function bestText(r,mode){if(!r)return '还没有记录';return mode==='guardian'?`通过 ${r.levels} 关 · ${fmt(r.score)} 分`:`${fmt(r.score)} 分`}

 if(mode==='guardian'){const p=glevel(G.gl);G.goal=p.goal;G.T=p.T;G.mul=p.mul;G.level=G.gl;
  pop(`第 ${G.gl} 关`,`${mmss(G.T)} 内消够 ${G.goal} 行`,C.or,2.2,44);}
 else if(mode==='collapse'&&presetOn()){G.board=mkBoard();PRESET_ROWS.forEach((r,i)=>{const y=H-PRESET_ROWS.length+i;for(let x=0;x<W;x++)G.board[y][x]=r[x]==='#'?1:0});G.preset=true;pop(MODES[mode].name,'填上倒数第二行的缺口，看石柱掉下去！',MODES[mode].color,2.6,44)}

function lvl(){return G.mode==='guardian'?G.gl:G.level}
function grav(){if(G.mode==='guardian')return Math.min(6,0.9+0.2*(G.gl-1));const L=G.level;if(L<=1)return GRAV[0];if(L-1>=GRAV.length)return GRAV[GRAV.length-1];const f=Math.max(0,Math.min(1,G.time/60-(L-1)));return GRAV[L-2]+(GRAV[L-1]-GRAV[L-2])*f}
function refill(){while(G.queue.length<6){if(!G.bag.length){G.bag=['I','J','L','O','S','T','Z'];for(let i=6;i>0;i--){const j=Math.floor(Math.random()*(i+1));[G.bag[i],G.bag[j]]=[G.bag[j],G.bag[i]]}}G.queue.push(G.bag.pop())}}
function spawnPos(t){return{t,r:0,x:Math.floor((W-NB[t])/2),y:t==='I'?-1:0}}
function fits(t,r,x,y){for(const [cx,cy] of ROT[t][r]){const X=x+cx,Y=y+cy;if(X<0||X>=W||Y>=H)return false;if(Y>=0&&G.board[Y][X])return false}return true}
function cellsOf(p){return ROT[p.t][p.r].map(([x,y])=>[p.x+x,p.y+y])}
function spawn(){refill();const p=spawnPos(G.queue.shift());refill();placeNew(p)}
function placeNew(p){if(!fits(p.t,p.r,p.x,p.y)){if(fits(p.t,p.r,p.x,p.y-1))p.y--;else{G.cur=p;return endGame('top')}}G.cur=p;G.lock=0;G.resets=0;G.fall=0}
function grounded(){const p=G.cur;return !fits(p.t,p.r,p.x,p.y+1)}
function moved(){if(grounded()&&G.resets<15){G.lock=0;G.resets++}}
function tryMove(dx,dy){const p=G.cur;if(!p)return false;if(fits(p.t,p.r,p.x+dx,p.y+dy)){p.x+=dx;p.y+=dy;if(dx){moved();sfx('move')}return true}return false}
function rotate(dir){const p=G.cur;if(!p||p.t==='O')return false;const nr=(p.r+dir+4)%4;const K=(p.t==='I'?KI:KJ)[''+p.r+nr];
 for(const [kx,ky] of K){if(fits(p.t,nr,p.x+kx,p.y-ky)){p.x+=kx;p.y-=ky;p.r=nr;moved();sfx('rot');return true}}return false}
function hardDrop(){if(!G.cur)return;let n=0;while(tryMove(0,1))n++;addPts('drop',n*2);G.hdFx={cells:cellsOf(G.cur),n,t:0.18};lockPiece()}
function holdPiece(){if(!G.canHold||!G.cur)return;const t=G.cur.t;if(G.hold){const h=G.hold;G.hold=t;placeNew(spawnPos(h))}else{G.hold=t;spawn()}G.canHold=false;sfx('rot')}
function addPts(k,n){n=Math.round(n);G.pts[k]+=n;G.score+=n}
function ghostY(){const p=G.cur;let y=p.y;while(fits(p.t,p.r,p.x,y+1))y++;return y}
function lockPiece(){const cs=cellsOf(G.cur);let above=true;for(const [x,y] of cs)if(y>=0){G.board[y][x]=1;above=false}
 G.lockFx={cells:cs,t:0.22};G.cur=null;G.canHold=true;sfx('lock');if(above)return endGame('top');G.chain=0;checkLines()}
function presetOn(){return DB.preset==null?COLLAPSE_PRESET:!!DB.preset}
function fullRows(){const rows=[];for(let y=0;y<H;y++)if(G.board[y].every(v=>v))rows.push(y);return rows}
function checkLines(){const rows=fullRows();if(rows.length)startClear(rows);else afterSettle()}
function startClear(rows){G.phase='clear';G.clr=rows;G.clrT=0;const n=rows.length,L=lvl(),b=BASE(n)*L;
 G.pts.line+=b;G.score+=b;if(G.chain>0){const c=b*G.chain;G.pts.chain+=c;G.score+=c}G.lines+=n;
 if(G.chain>0)pop(`连锁 ×${G.chain+1}`,'+'+fmt(b*(G.chain+1)),C.pu,1.1,60);
 else pop(['','','双消！','三消！','四消！'][Math.min(n,4)]||'大消除！','+'+fmt(b),C.ye,0.9,n>1?40:0);
 if(n===1&&G.chain===0)pop('','+'+fmt(b),C.ye,0.8,0);
 for(const y of rows)for(let x=0;x<W;x++)shards(x,y,5);
 sfx(G.chain>0?'chain':'clear',n);
 if(G.mode==='guardian')pushBack(n,G.chain);
}
function removeRows(rows){G.board=G.board.filter((r,i)=>!rows.includes(i));while(G.board.length<H)G.board.unshift(Array(W).fill(0))}
/* 崩塌（v4）：消行后，每一列里下面有空格的方块都往下掉一格，一步一步直到每列都压实没有空洞 */
function unsupported(){const b=G.board,out=[];
 for(let x=0;x<W;x++){let hole=false;for(let y=H-1;y>=0;y--){if(!b[y][x])hole=true;else if(hole)out.push([x,y])}}
 return out}
function startFall(){const u=unsupported();if(!u.length)return false;G.mv=u;G.fallT=0;G.phase='fall';return true}
function stepFall(){const b=G.board;for(const [x,y] of G.mv)b[y][x]=0;for(const [x,y] of G.mv)b[y+1][x]=1;
 const u=unsupported();if(u.length){G.mv=u;G.fallT=0;return}
 G.mv=null;sfx('thud');const rows=fullRows();if(rows.length){G.chain++;G.maxChain=Math.max(G.maxChain,G.chain);G.phase='wait';G.waitT=0;G.waitRows=rows}else afterSettle()}
function afterSettle(){G.phase='play';if(G.mode==='guardian'&&G.lines>=G.goal)return winLevel();spawn()}

/* guardian */
function pourRate(){return R0*G.mul*(1+1.2*G.lvTime/G.T)}
function pourPerSec(){return 5.5*pourRate()/R0}
function pushBack(n,chain){const add=PUSH[Math.min(n,4)]+(n>4?0.2:0)+chain*0.08;const before=G.dist;G.dist=Math.min(1,G.dist+add);G.kick=Math.min(.75,(G.kick||0)+Math.max(0,add-(G.dist-before)));G.lastPush={n,add,px:add*RANGE};G.stepT=1;G.pushFx=1;
 for(let i=0;i<4+n*4;i++)G.roll.push({x:0,y:40+Math.random()*120,vx:120+Math.random()*180*(0.6+n*0.25),r:7+Math.random()*6,a:Math.random()*6,va:4+Math.random()*6,t:0,s:Math.floor(Math.random()*12)});
 if(n>1)pop(`推回一大截!`,`×${n} 行 · 推回 ${Math.round(add*100)}%`,C.cy,1.3,-2);else pop('','推回去了',C.cy,0.9,-1)}
function winLevel(){G.phase='win';G.endT=0;G.bonus=Math.ceil(G.T-G.lvTime)*10*G.gl;G.score+=G.bonus;G.pts.line+=G.bonus;sfx('win')}
function endGame(reason){if(G.phase==='over'||G.phase==='lose'||G.phase==='win')return;G.reason=reason;G.endT=0;
 if(G.mode==='guardian'){G.phase='lose';sfx('lose')}else{G.phase='over';sfx('lose')}}

function recordGame(){if(!G||G.saved)return null;const pid=DB.cur;if(!pid)return null;
 const gd=G.mode==='guardian';const levels=gd?(G.phase==='win'?G.gl:G.gl-1):0;
 if(G.score<=0&&levels<=0&&G.lines<=0){G.saved=true;return null}
 const prev=bestOf(pid,G.mode);
 const r={pid,mode:G.mode,score:G.score,lines:G.lines,level:lvl(),levels,dur:Math.round(G.time),chain:G.maxChain+1,date:Date.now()};
 DB.records.push(r);saveDB();G.saved=true;
 const rk=ranking(G.mode);const pos=rk.findIndex(x=>x.p.id===pid)+1;
 return{r,prev,isBest:better(r,prev,G.mode),pos,total:rk.length}}

/* ---------- update ---------- */
const STEP=1/60;const held={L:false,R:false};let dasDir=null,dasT=0,arrT=0;
function update(dt){
 if(screen!=='play'||paused||!G)return;
 const ph=G.phase;
 fxUpdate(dt);
 if(ph==='over'||ph==='lose'||ph==='win'){G.endT+=dt;
  if(G.mode==='guardian'){G.dDisp+=(G.dist-G.dDisp)*Math.min(1,dt*6)}
  if(!G.shown&&G.endT>(ph==='win'?0.9:1.0)){G.shown=true;showEnd()}return}
 G.time+=dt;
 if(G.mode!=='guardian'){const nl=1+Math.floor(G.time/60);if(nl>G.level){G.level=nl;if(G){G.pops=G.pops.filter(q=>!q.top);G.pops.push({t:0,txt:`第 ${nl} 级`,sub:'速度慢慢变快',c:C.cy,life:1.1,size:22,top:true})};sfx('up')}
  G.survAcc+=10*G.level*dt;if(G.survAcc>=1){const k=Math.floor(G.survAcc);G.survAcc-=k;addPts('surv',k)}}
 else{G.lvTime+=dt;G.dist-=pourRate()*dt;G.dDisp+=(G.dist-G.dDisp)*Math.min(1,dt*(G.pushFx>0?5:8));
  G.stepT=Math.max(0,G.stepT-dt*2.2);if(G.kick>0){G.kickT=(G.kickT||0);G.kick=Math.max(0,G.kick-dt*Math.max(.12,G.kick*1.1))}G.pushFx=Math.max(0,G.pushFx-dt*1.6);
  G.pourAcc+=dt*pourPerSec();while(G.pourAcc>=1){G.pourAcc-=1;if(G.pour.length<140)G.pour.push({x:HOLE_X-34+Math.random()*68,y:24,vx:-8-Math.random()*16,vy:15+Math.random()*20,r:8+Math.random()*5,a:Math.random()*6,va:(Math.random()-.5)*5,s:Math.floor(Math.random()*10),land:0,t:0})}
  if(G.dist<=0){G.dist=0;return endGame('spike')}
  if(G.lvTime>=G.T)return endGame('time');
  if(G.lvTime>G.T-10.5&&Math.floor(G.lvTime)!==G.lastTick&&G.lvTime>G.T-10){G.lastTick=Math.floor(G.lvTime);sfx('tick')}}
 if(ph==='clear'){G.clrT+=dt;if(G.clrT>=0.28){removeRows(G.clr);G.clr=[];if(G.mode==='collapse'&&startFall())return;afterSettle()}return}
 if(ph==='fall'){G.fallT+=dt/0.055;if(G.fallT>=1)stepFall();return}
 if(ph==='wait'){G.waitT+=dt;if(G.waitT>=0.3)startClear(G.waitRows);return}
 if(ph!=='play'||!G.cur)return;
 if(dasDir&&held[dasDir]){dasT+=dt;if(dasT>=0.17){arrT+=dt;while(arrT>=0.05){arrT-=0.05;tryMove(dasDir==='L'?-1:1,0)}}}
 const g=G.soft?Math.max(grav(),20):grav();G.fall+=g*dt;
 while(G.fall>=1){G.fall-=1;if(tryMove(0,1)){if(G.soft)addPts('drop',1)}else{G.fall=0;break}}
 if(G.cur&&grounded()){G.lock+=dt;if(G.lock>=0.5)lockPiece()}else G.lock=0;
}
function fxUpdate(dt){
 for(const f of G.fx){f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=30*dt;f.a+=f.va*dt}G.fx=G.fx.filter(f=>f.t<f.life);
 for(const p of G.pops)p.t+=dt;G.pops=G.pops.filter(p=>p.t<p.life);
 if(G.lockFx){G.lockFx.t-=dt;if(G.lockFx.t<=0)G.lockFx=null}
 if(G.hdFx){G.hdFx.t-=dt;if(G.hdFx.t<=0)G.hdFx=null}
  if(G.mode==='guardian'){G.kickD=(G.kickD||0)+((G.kick||0)-(G.kickD||0))*Math.min(1,dt*7);
  const pxF=G.pxCur||400;
  for(const s of G.pour){s.t+=dt;if(!s.land){s.vy=Math.min(120,s.vy+150*dt);s.y+=s.vy*dt;s.x+=s.vx*dt;s.a+=s.va*dt;const ty=topY(s.x)-s.r*.55;if(s.y>=ty){s.y=ty;s.land=1;s.lt=0;s.vx=-(35+Math.random()*55);if(Math.random()<.7)G.dust.push({x:s.x,y:s.y+s.r*.5,t:0,vx:(Math.random()-.5)*30,vy:-10-Math.random()*20})}}
   else{s.lt+=dt;s.x+=s.vx*dt;s.vx*=Math.pow(.55,dt);s.y=topY(s.x)-s.r*.55;s.a+=s.vx*dt/s.r}}
  G.pour=G.pour.filter(s=>!s.land||(s.lt<1.6&&s.x>pxF+20));
  for(const s of G.roll){s.t+=dt;s.x+=s.vx*dt;s.vx*=Math.pow(0.12,dt);s.a+=s.va*dt}G.roll=G.roll.filter(s=>s.t<0.9);
  for(const s of G.sweat){s.t+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=260*dt}G.sweat=G.sweat.filter(s=>s.t<0.8);
  for(const s of G.dust){s.t+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt}G.dust=G.dust.filter(s=>s.t<0.7);
  if(G.phase==='play'||G.phase==='clear'||G.phase==='fall'||G.phase==='wait'){const d=G.dDisp;
   if(d<0.65&&Math.random()<dt*(2+(0.65-d)*14)){G.sweat.push({x:0,y:0,vx:-20-Math.random()*40,vy:-50-Math.random()*40,t:0})}
   if(Math.random()<dt*(1.5+3*(1-d)))G.dust.push({x:-1,y:0,t:0,vx:-20-Math.random()*30,vy:-8-Math.random()*12,heel:1})}
 }
}
function shards(x,y,n){if(G.fx.length>700)return;for(let i=0;i<n;i++)G.fx.push({x:x+.5,y:y+.5,vx:(Math.random()-.5)*14,vy:-Math.random()*12-2,t:0,life:.5+Math.random()*.4,a:Math.random()*6,va:(Math.random()-.5)*20,s:.12+Math.random()*.16,cell:1})}

function topY(x){const c=Math.max(0,1-Math.abs(x-HOLE_X)/175);return 84+Math.sin(x*0.045)*4-c*c*16}
const hs=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};

function mkC(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*K));c.height=Math.max(1,Math.round(h*K));const x=c.getContext('2d');x.scale(K,K);return[c,x]}
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else{c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}}
function fit(){const vw=window.innerWidth,vh=window.innerHeight;S=Math.min(vw/1280,vh/800);
 $('#stage').style.transform=`translate(${Math.round((vw-1280*S)/2)}px,${Math.round((vh-800*S)/2)}px) scale(${S})`;
 const dpr=Math.min(2.5,window.devicePixelRatio||1);K=S*dpr;cv.width=Math.round(1280*K);cv.height=Math.round(800*K);spr={};buildBg()}

 let sd=11;const R=()=>(sd=(sd*16807)%2147483647)/2147483647;for(let i=0;i<140;i++){x.fillStyle=`rgba(244,241,234,${.10+R()*.45})`;x.beginPath();x.arc(R()*1280,R()*800,R()*1.3+.3,0,7);x.fill()}bgc=c}
function brick(sz,v){const key=sz+'_'+v;if(spr[key])return spr[key];const[c,x]=mkC(sz,sz);const r=sz*.12,b=Math.max(2,sz*.13);
 rr(x,0,0,sz,sz,r);x.save();x.clip();let g=x.createLinearGradient(sz*.15,0,sz*.5,sz);g.addColorStop(0,'#FFF1C2');g.addColorStop(.28,'#F7CF6A');g.addColorStop(.6,'#E0A23A');g.addColorStop(.85,'#B9781F');g.addColorStop(1,'#8A5414');x.fillStyle=g;x.fillRect(0,0,sz,sz);
 x.fillStyle='rgba(255,248,215,.72)';x.beginPath();x.moveTo(0,0);x.lineTo(sz,0);x.lineTo(sz-b,b);x.lineTo(b,b);x.lineTo(b,sz-b);x.lineTo(0,sz);x.fill();

 const i0=b*1.1;g=x.createLinearGradient(i0,i0,sz*.6,sz-i0);g.addColorStop(0,'#FFE08A');g.addColorStop(.55,'#E8AE45');g.addColorStop(1,'#C98A2A');x.fillStyle=g;x.fillRect(i0,i0,sz-2*i0,sz-2*i0);
 x.strokeStyle='rgba(255,240,190,.35)';x.lineWidth=1;x.strokeRect(i0+.5,i0+.5,sz-2*i0-1,sz-2*i0-1);

 x.save();x.translate(sz*.4,sz*.24);x.rotate(-.21);g=x.createLinearGradient(-sz*.22,0,sz*.22,0);g.addColorStop(0,'rgba(255,255,255,.92)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();x.ellipse(0,0,sz*.22,sz*.065,0,0,7);x.fill();x.restore();
 if(v===0){x.fillStyle='rgba(70,35,0,.13)';x.fillRect(0,0,sz,sz)}if(v===1){x.fillStyle='rgba(255,250,225,.12)';x.fillRect(0,0,sz,sz)}

  const g=x.createRadialGradient(30,22,6,40,32,40);g.addColorStop(0,'rgba(255,245,225,.18)');g.addColorStop(.7,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(20,12,5,.55)');x.fillStyle=g;x.fillRect(0,0,80,64);
  x.fillStyle='rgba(255,255,255,.35)';x.beginPath();x.ellipse(27,19,10,5,-.5,0,7);x.fill();stones.push(c)}
 const sc=document.createElement('canvas');sc.width=150;sc.height=359;const sx=sc.getContext('2d');sx.drawImage(imgs.pile,190,0,150,359,0,0,150,359);sx.globalCompositeOperation='destination-in';const fg=sx.createLinearGradient(0,0,150,0);fg.addColorStop(0,'rgba(0,0,0,0)');fg.addColorStop(.22,'#000');fg.addColorStop(.78,'#000');fg.addColorStop(1,'rgba(0,0,0,0)');sx.fillStyle=fg;sx.fillRect(0,0,150,359);strip=sc}

/* ---------- render ---------- */
function LAY(){const gd=G.mode==='guardian';const cs=gd?24:34;const fw=W*cs+14,fh=H*cs+14;const bx=Math.round((1280-fw)/2),by=gd?244:19;const sw=340;return{gd,cs,bx,by,fw,fh,lx:bx-30-sw,rx:bx+fw+30,sw,bot:by+fh}}
function T(t,x,y,size,col,weight,align,base){ctx.font=`${weight||400} ${size}px ${FONT}`;ctx.fillStyle=col||C.txt;ctx.textAlign=align||'left';ctx.textBaseline=base||'alphabetic';ctx.fillText(t,x,y)}
function card(x,y,w,h){rr(ctx,x,y,w,h,18);ctx.fillStyle='rgba(30,39,66,.78)';ctx.fill();ctx.strokeStyle='rgba(244,241,234,.10)';ctx.lineWidth=1;ctx.stroke()}
function miniPiece(t,cx,cy,sz){if(!t)return;const cs=ROT[t][0];let x0=9,x1=-9,y0=9,y1=-9;for(const [x,y] of cs){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
 const w=(x1-x0+1)*(sz+2)-2,h=(y1-y0+1)*(sz+2)-2;const b=brick(sz,2);for(const [x,y] of cs)ctx.drawImage(b,cx-w/2+(x-x0)*(sz+2),cy-h/2+(y-y0)*(sz+2),sz,sz)}
let lastT=0;
function render(t){lastT=t;ctx.setTransform(K,0,0,K,0,0);ctx.clearRect(0,0,1280,800);if(bgc)ctx.drawImage(bgc,0,0,1280,800);if(screen!=='play'||!G)return;
 const L=LAY();let sx=0,sy=0;const live=['play','clear','fall','wait'].includes(G.phase)&&!paused;
 if(L.gd&&live&&G.dDisp<0.2){const a=(0.2-G.dDisp)/0.2*4;sx=a*Math.sin(t*47);sy=a*.6*Math.cos(t*39)}
 ctx.save();ctx.translate(sx,sy);if(L.gd)drawBanner(t,live);drawBoard(L,t);drawHud(L,t);ctx.restore()}
function drawBoard(L,t){const{cs,bx,by,fw,fh}=L;const ox=bx+7,oy=by+7;
 rr(ctx,bx,by,fw,fh,18);ctx.fillStyle='rgba(20,26,46,.88)';ctx.fill();ctx.strokeStyle='rgba(244,241,234,.12)';ctx.lineWidth=1;ctx.stroke();

/* ---------- audio (off by default) ---------- */
let AC=null;
function toggleSound(){DB.sound=!DB.sound;saveDB();if(DB.sound){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}sfx('rot')}$('#bSnd').textContent=DB.sound?'🔊 音效':'🔇 音效'}
function sfx(k,n){if(!DB.sound)return;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return}
 const now=AC.currentTime;const tone=(f,d,type,v,delay,f2)=>{delay=delay||0;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,now+delay);if(f2)o.frequency.exponentialRampToValueAtTime(f2,now+delay+d);g.gain.setValueAtTime(v||.06,now+delay);g.gain.exponentialRampToValueAtTime(.0001,now+delay+d);o.connect(g);g.connect(AC.destination);o.start(now+delay);o.stop(now+delay+d+.03)};
 switch(k){case'move':tone(520,.035,'square',.015);break;case'rot':tone(700,.05,'triangle',.04);break;case'lock':tone(200,.08,'triangle',.07,0,100);break;case'thud':tone(150,.12,'sine',.1,0,60);break;
  case'clear':for(let i=0;i<=Math.min(4,n||1);i++)tone(523*Math.pow(1.26,i),.18,'triangle',.06,i*.06);break;case'chain':for(let i=0;i<5;i++)tone(660*Math.pow(1.19,i),.14,'square',.035,i*.05);break;
  case'up':tone(523,.1,'sine',.03);tone(659,.14,'sine',.025,.08);break;case'win':[523,659,784,1046].forEach((f,i)=>tone(f,.26,'triangle',.07,i*.12));break;
  case'lose':[392,330,262].forEach((f,i)=>tone(f,.3,'sawtooth',.04,i*.18));break;case'tick':tone(880,.05,'square',.025);break}}

/* ---------- 存档 导出 / 导入 (title screen only; never touches gameplay) ---------- */
const SAVE_FMT='fangkuai-huayuan-save',SAVE_VER=1;
function gameKeys(){const ks=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('fangkuai-huayuan')===0)ks.push(k)}}catch(e){}if(!ks.includes(SKEY))ks.push(SKEY);return ks}
function buildSave(){saveDB();const keys={};for(const k of gameKeys()){let v=null;try{v=localStorage.getItem(k)}catch(e){}if(k===SKEY)keys[k]=JSON.parse(JSON.stringify(DB));else if(v!=null){try{keys[k]=JSON.parse(v)}catch(e){keys[k]=v}}}
 return{format:SAVE_FMT,version:SAVE_VER,app:'方块花园',exportedAt:new Date().toISOString(),counts:{players:DB.players.length,records:DB.records.length},keys}}
function saveName(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `方块花园-存档-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`}
const isNum=v=>typeof v==='number'&&isFinite(v);
/* returns {db} or {err:'中文原因'} */
function parseSave(text){let o;if(typeof text!=='string'||!text.trim())return{err:'文件是空的。'};if(text.length>5e6)return{err:'文件太大了，不像是方块花园的存档。'};
 try{o=JSON.parse(text.replace(/^\uFEFF/,''))}catch(e){return{err:'这个文件不是有效的存档（无法读取 JSON）。'}}
 if(!o||typeof o!=='object'||o.format!==SAVE_FMT)return{err:'这不是方块花园的存档文件。'};
 if(!Number.isInteger(o.version)||o.version<1)return{err:'存档版本号不正确。'};
 if(o.version>SAVE_VER)return{err:'这个存档来自更新版本的游戏（版本 '+o.version+'），请先更新游戏。'};
 const d=o.keys&&o.keys[SKEY];if(!d||typeof d!=='object'||!Array.isArray(d.players)||!Array.isArray(d.records))return{err:'存档里缺少玩家或记录数据。'};
 if(d.players.length>200||d.records.length>5000)return{err:'存档里的数据数量不正常。'};
 const players=[],ids=new Set();
 for(const p of d.players){if(!p||typeof p.id!=='string'||!p.id||p.id.length>40||typeof p.name!=='string'||!p.name.trim())return{err:'存档里的玩家数据格式不对。'};
  if(ids.has(p.id))continue;ids.add(p.id);players.push({id:p.id,name:p.name.trim().slice(0,8),color:typeof p.color==='string'&&/^#[0-9a-fA-F]{3,8}$/.test(p.color)?p.color:AVC[players.length%AVC.length],created:isNum(p.created)?p.created:Date.now()})}
 const records=[];
 for(const r of d.records){if(!r||typeof r.pid!=='string'||!MODES[r.mode]||!isNum(r.score)||!isNum(r.date))return{err:'存档里的成绩记录格式不对。'};
  if(!ids.has(r.pid))continue;const x={pid:r.pid,mode:r.mode,score:Math.max(0,r.score),lines:isNum(r.lines)?r.lines:0,level:isNum(r.level)?r.level:1,levels:isNum(r.levels)?r.levels:0,dur:isNum(r.dur)?r.dur:0,chain:isNum(r.chain)?r.chain:1,date:r.date};
  if(typeof r.run==='string')x.run=r.run;records.push(x)}
 records.sort((a,b)=>a.date-b.date);
 const db={players,cur:typeof d.cur==='string'&&ids.has(d.cur)?d.cur:(players[0]?players[0].id:null),records,sound:!!d.sound,mode:MODES[d.mode]?d.mode:'classic'};
 if(typeof d.preset==='boolean')db.preset=d.preset;
 return{db,when:o.exportedAt}}
const recKey=r=>[r.pid,r.mode,r.run||'',r.date,r.score,r.lines,r.levels].join('|');
function mergeDB(cur,inc){const out=JSON.parse(JSON.stringify(cur));const idMap={};
 for(const p of inc.players){let ex=out.players.find(x=>x.id===p.id)||out.players.find(x=>x.name===p.name);if(ex)idMap[p.id]=ex.id;else{out.players.push({...p});idMap[p.id]=p.id}}
 const seen=new Set(out.records.map(recKey));
 for(const r0 of inc.records){const r={...r0,pid:idMap[r0.pid]||r0.pid};
  if(r.run){const ex=out.records.find(x=>x.run===r.run&&x.pid===r.pid);if(ex){if(better(r,ex,'guardian')){Object.assign(ex,r)}continue}}
  const k=recKey(r);if(seen.has(k))continue;seen.add(k);out.records.push(r)}
 out.records.sort((a,b)=>a.date-b.date);
 /* keep each player's best per mode even if history is trimmed to 800 */
 if(out.records.length>800){const keep=new Set();for(const p of out.players)for(const m in MODES){let b=null;for(const r of out.records)if(r.pid===p.id&&r.mode===m&&better(r,b,m))b=r;if(b)keep.add(b)}
  let extra=out.records.length-800;out.records=out.records.filter(r=>{if(extra>0&&!keep.has(r)){extra--;return false}return true})}
 if(!out.cur||!out.players.some(p=>p.id===out.cur))out.cur=out.players[0]?out.players[0].id:null;return out}
function applyDB(nd){DB=nd;ensurePlayer();saveDB();renderTitle()}
function dlgSave(msg){const n=DB.players.length,rc=DB.records.length;
 openDlg(`<h2>💾 存档</h2><div class="muted" style="margin-bottom:6px;max-width:600px;line-height:1.6">换设备、换浏览器，或从微信／文件里打开游戏时，记录不会自动带过去。<br>先在这里「导出存档」存一个文件，到新地方再「导入存档」。</div>
 <div class="small muted" style="margin-bottom:14px">现在这里有 ${n} 个玩家 · ${rc} 条记录</div>
 <div id="svMsg" class="small" style="min-height:20px;margin-bottom:8px;color:${C.mi}">${msg||''}</div>
 <div style="display:flex;flex-direction:column;gap:12px;width:560px">
  <button class="btn pri" id="svExp">⬇ 导出存档（保存成文件）</button>
  <label class="btn sec" id="svImpL" for="svFile" style="cursor:pointer">⬆ 导入存档（选择文件）</label><input type="file" id="svFile" accept="application/json,.json" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
  <div class="row"><button class="btn sec" id="svCopy" style="flex:1;font-size:16px;min-height:52px">显示存档文字（复制）</button><button class="btn sec" id="svPaste" style="flex:1;font-size:16px;min-height:52px">粘贴存档文字导入</button></div>
  <button class="btn sec" id="svX" style="min-height:52px">关闭</button></div>`);
 $('#svX').onclick=closeDlg;$('#svExp').onclick=exportSave;$('#svCopy').onclick=()=>dlgSaveText();$('#svPaste').onclick=dlgPasteImport;
 const f=$('#svFile');f.onchange=()=>{const file=f.files&&f.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>startImport(String(rd.result||''));rd.onerror=()=>dlgImportErr('读取文件失败，请再试一次。');rd.readAsText(file)}}
function exportSave(){const txt=JSON.stringify(buildSave(),null,1);const name=saveName();
 let ok=false;try{const a=document.createElement('a');if(window.Blob&&window.URL&&URL.createObjectURL&&('download' in a)){const url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.href=url;a.download=name;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},4000);ok=true}}catch(e){ok=false}
 if(ok)dlgSave(`已导出：${esc(name)}（如果没看到下载，点「显示存档文字」复制保存）`);else dlgSaveText('这个浏览器不支持直接下载文件，请全选下面的文字，复制后存起来（比如发给自己）。')}
function dlgSaveText(tip){const txt=JSON.stringify(buildSave());
 openDlg(`<h2>存档文字</h2><div class="muted" style="margin-bottom:10px;max-width:640px">${tip||'全选下面的文字并复制，保存好。导入时点「粘贴存档文字导入」。'}</div>
 <textarea id="svTxt" readonly class="svta">${esc(txt)}</textarea>
 <div class="row" style="margin-top:12px"><button class="btn pri" id="svCp" style="flex:1">复制</button><button class="btn sec" id="svBk" style="flex:1">返回</button></div>`);
 const ta=$('#svTxt');$('#svBk').onclick=()=>dlgSave();
 $('#svCp').onclick=async()=>{ta.focus();ta.select();try{ta.setSelectionRange(0,ta.value.length)}catch(e){}let ok=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(ta.value);ok=true}}catch(e){}if(!ok){try{ok=document.execCommand('copy')}catch(e){}}$('#svCp').textContent=ok?'已复制 ✓':'请手动长按全选复制'}}
function dlgPasteImport(){openDlg(`<h2>粘贴存档文字</h2><div class="muted" style="margin-bottom:10px">把之前复制的存档文字粘贴到下面：</div>
 <textarea id="svIn" class="svta" placeholder="在这里粘贴"></textarea>
 <div class="row" style="margin-top:12px"><button class="btn pri" id="svGo" style="flex:1">导入</button><button class="btn sec" id="svBk" style="flex:1">返回</button></div>`);
 $('#svBk').onclick=()=>dlgSave();$('#svGo').onclick=()=>startImport($('#svIn').value)}
function dlgImportErr(msg){openDlg(`<h2>导入失败</h2><div style="color:${C.red};font-size:18px;margin:10px 0 6px;max-width:560px">${esc(msg)}</div><div class="muted" style="margin-bottom:18px">现在的存档没有任何改动。</div>
 <div class="row"><button class="btn sec" id="svBk" style="flex:1">返回</button></div>`);$('#svBk').onclick=()=>dlgSave()}
function startImport(text){const res=parseSave(text);if(res.err)return dlgImportErr(res.err);const inc=res.db;
 const when=res.when&&!isNaN(Date.parse(res.when))?new Date(res.when).toLocaleString('zh-CN',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'未知时间';
 openDlg(`<h2>导入存档？</h2><div class="muted" style="margin:6px 0 4px">存档时间：${esc(when)}</div>
 <div style="font-size:18px;margin:10px 0">文件里有 <b>${inc.players.length}</b> 个玩家（${inc.players.slice(0,6).map(p=>esc(p.name)).join('、')}${inc.players.length>6?'…':''}）· <b>${inc.records.length}</b> 条记录</div>
 <div class="small muted" style="line-height:1.7;margin-bottom:16px;max-width:600px">「合并」：两边的玩家都保留，同名玩家合成一个，记录合在一起（重复的不算两次），各自最好成绩保留。<br>「覆盖」：删掉这里现有的 ${DB.players.length} 个玩家和 ${DB.records.length} 条记录，换成文件里的。</div>
 <div class="row"><button class="btn pri" id="imMerge" style="flex:1">合并</button><button class="btn sec" id="imOver" style="flex:1;color:${C.or}">覆盖</button><button class="btn sec" id="imNo" style="flex:1">取消</button></div>`);
 $('#imNo').onclick=()=>dlgSave();
 $('#imMerge').onclick=()=>{applyDB(mergeDB(DB,inc));dlgSave(`合并完成：现在有 ${DB.players.length} 个玩家 · ${DB.records.length} 条记录`)};
 $('#imOver').onclick=e=>{const b=e.currentTarget;if(!b.dataset.c){b.dataset.c=1;b.textContent='再点一次确认覆盖';return}applyDB(inc);dlgSave(`覆盖完成：现在有 ${DB.players.length} 个玩家 · ${DB.records.length} 条记录`)}}

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){let dt=(now-last)/1000;last=now;if(dt>0.25)dt=0.25;if(dt<0)dt=0;acc+=dt;let n=0;
 while(acc>=STEP&&n<20){try{update(STEP)}catch(e){console.error(e);acc=0;break}acc-=STEP;n++}
 try{render(now/1000)}catch(e){console.error(e)}requestAnimationFrame(frame)}
$('#bPause').onclick=()=>{if(paused)resume();else pauseGame()};$('#bSnd').onclick=toggleSound;
fit();showLayer();requestAnimationFrame(frame);

/* ---------- debug hook for automated playtest (only with ?debug=1) ---------- */
if(DEBUG){window.__bg={
 get state(){return G?{mode:G.mode,phase:G.phase,board:G.board.map(r=>r.slice()),cur:G.cur?{...G.cur}:null,queue:G.queue.slice(0,3),hold:G.hold,score:G.score,lines:G.lines,level:G.level,gl:G.gl,goal:G.goal,dist:G.dist,lvTime:G.lvTime,maxChain:G.maxChain,shown:!!G.shown,paused,screen,pts:{...G.pts}}:{screen,paused}},
 cells:(t,r)=>ROT[t][r].map(a=>a.slice()),db:()=>JSON.parse(JSON.stringify(DB)),
 setBoard(rows){G.board=rows.map(s=>s.split('').map(c=>c==='#'?1:0));while(G.board.length<H)G.board.unshift(Array(W).fill(0))},
 setDist(d){G.dist=G.dDisp=d},setLvTime(t){G.lvTime=t},grav:()=>grav(),gravAt(t){const a=G.time,b=G.level;G.time=t;G.level=1+Math.floor(t/60);const v=grav();G.time=a;G.level=b;return v},setTime(t){G.time=t},setQueue(arr){G.queue=arr.concat(G.queue);G.cur=null;spawn()},
 setCur(t){placeNew(spawnPos(t))},setLines(n){G.lines=n},vis(){return G?{hx:SP+(Math.max(0,Math.min(1,G.dDisp))+(G.kickD||0))*RANGE,pour:G.pour.length,falling:G.pour.filter(s=>!s.land).length,rolling:G.pour.filter(s=>s.land).length,perSec:G.mode==='guardian'?pourPerSec():0,lastPush:G.lastPush||null}:null},preset:()=>presetOn()}}
</script></body></html>
